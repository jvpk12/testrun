<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Form</title>
    <!-- Tailwind CSS v4 CDN script and your separate custom stylesheet -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Event RSVP</h2>
        
        <form action="#" method="POST" class="space-y-6">
            <!-- Question 1: What is your name? -->
            <div>
                <label for="name" class="block text-sm font-medium text-slate-700 mb-2">1. What is your name?</label>
                <input type="text" id="name" name="name" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                    placeholder="Enter your full name">
            </div>

            <!-- Question 2: Will you attend? (Boolean Yes/No) -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">2. Will you attend?</label>
                <div class="flex gap-6">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-700">
                        <input type="radio" name="attendance" value="yes" required class="text-blue-600 focus:ring-blue-500"> Yes
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-slate-700">
                        <input type="radio" name="attendance" value="no" required class="text-blue-600 focus:ring-blue-500"> No
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 cursor-pointer">
                Submit Response
            </button>
        </form>
    </div>

</body>
</html>
